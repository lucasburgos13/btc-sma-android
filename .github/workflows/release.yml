name: Preparar APK para Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já enviada ao GitHub (exemplo: v0.1.0)'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restaurar chave privada de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure os secrets de assinatura descritos no README.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Testar e gerar APK assinado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Criar rascunho de Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BTC-SMA-200.apk
          gh release create "$RELEASE_TAG" BTC-SMA-200.apk --verify-tag --draft --title "BTC SMA 200 $RELEASE_TAG" --notes 'Android 8+. BTC/USD na Kraken, SMA 200 diária e semanal, alertas no fechamento. Consultas periódicas sujeitas a atrasos do Android.'
      - name: Remover chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
